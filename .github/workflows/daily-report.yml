name: Daily Stock Report

on:
  workflow_dispatch:
    inputs:
      expected_date:
        description: "Optional expected trading date (YYYY-MM-DD); does not backdate collection"
        type: string
        default: ""
      publish_pages:
        description: "Publish the validated report to GitHub Pages"
        type: boolean
        default: false
      send_telegram:
        description: "Allow the normal opted-in Telegram notification"
        type: boolean
        default: false
  schedule:
    # 21:07, 21:27, 21:47 Asia/Taipei; avoid the top of the hour.
    - cron: "7 13 * * 1-5"
    - cron: "27 13 * * 1-5"
    - cron: "47 13 * * 1-5"

permissions:
  contents: read

concurrency:
  group: daily-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: FinMind 2303 preflight
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/check_finmind_connection.py
      - name: Collect 22 public symbols
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update_public_data.py --output run-output
      - name: Stage successful report
        run: cp run-output/* docs/data/
      - name: Safe diagnostics and quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-diagnostics
          path: |
            diagnostics/finmind-smoke.json
            run-output/quality.json
            run-output/daily-report.md
          if-no-files-found: warn
          retention-days: 7
      - name: Verify public artifacts
        run: python scripts/validate_public.py
      - name: Job summary
        run: cat docs/data/daily-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: public-daily-report
          path: |
            docs/data/daily-report.md
            docs/data/quality.json
            docs/data/stocks.json
          if-no-files-found: error
          retention-days: 30
      - name: Check optional expected trading date
        if: github.event_name == 'workflow_dispatch' && inputs.expected_date != ''
        env:
          EXPECTED_REPORT_DATE: ${{ inputs.expected_date }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          from datetime import date
          from pathlib import Path

          expected = os.environ["EXPECTED_REPORT_DATE"]
          try:
              if date.fromisoformat(expected).isoformat() != expected:
                  raise ValueError
          except ValueError:
              raise SystemExit("Expected trading date must use YYYY-MM-DD.")
          report = json.loads(Path("docs/data/stocks.json").read_text(encoding="utf-8"))
          actual = report["summary"]["asOf"]
          target = report["calendar"]["targetDate"]
          if actual != expected or target != expected:
              raise SystemExit(f"Report date mismatch: expected {expected}; asOf={actual}; targetDate={target}.")
          print(f"Expected trading date verified: {expected}.")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: docs/
          if-no-files-found: error
          retention-days: 2
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_pages == true))
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  notify:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.send_telegram == true)) &&
      vars.TELEGRAM_NOTIFICATIONS_ENABLED == 'true'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: taylorstock-telegram-notifications
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: public-daily-report
          path: report
      - name: Opt-in Telegram market alerts
        env:
          TELEGRAM_NOTIFICATIONS_ENABLED: ${{ vars.TELEGRAM_NOTIFICATIONS_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_LEDGER_TOKEN: ${{ secrets.TELEGRAM_LEDGER_TOKEN }}
          TELEGRAM_LEDGER_REPO: ${{ secrets.TELEGRAM_LEDGER_REPO }}
        run: python scripts/send_telegram.py --report report/stocks.json
