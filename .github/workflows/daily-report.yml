name: Daily Stock Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0,20,40 13 * * 1-5"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: daily-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: FinMind 2303 preflight
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/check_finmind_connection.py
      - name: Collect 22 public symbols
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update_public_data.py --output run-output
      - name: Stage successful report
        run: cp run-output/* docs/data/
      - name: Safe diagnostics and quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-diagnostics
          path: |
            diagnostics/finmind-smoke.json
            run-output/quality.json
            run-output/daily-report.md
          if-no-files-found: warn
          retention-days: 7
      - name: Verify public artifacts
        run: python scripts/validate_public.py
      - name: Job summary
        run: cat docs/data/daily-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: public-daily-report
          path: |
            docs/data/daily-report.md
            docs/data/quality.json
            docs/data/stocks.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: docs/
          if-no-files-found: error
          retention-days: 2
  publish:
    if: github.ref == 'refs/heads/main'
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  notify:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.TELEGRAM_NOTIFICATIONS_ENABLED == 'true'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: taylorstock-telegram-notifications
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: public-daily-report
          path: report
      - name: Opt-in Telegram market alerts
        env:
          TELEGRAM_NOTIFICATIONS_ENABLED: ${{ vars.TELEGRAM_NOTIFICATIONS_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_LEDGER_TOKEN: ${{ secrets.TELEGRAM_LEDGER_TOKEN }}
          TELEGRAM_LEDGER_REPO: ${{ secrets.TELEGRAM_LEDGER_REPO }}
        run: python scripts/send_telegram.py --report report/stocks.json
