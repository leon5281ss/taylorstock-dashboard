name: Daily Stock Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0,20,40 13 * * 1-5"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: daily-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Collect 22 public symbols
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update_public_data.py
      - name: Verify public artifacts
        run: python scripts/validate_public.py
      - name: Job summary
        run: cat docs/data/daily-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: public-daily-report
          path: |
            docs/data/daily-report.md
            docs/data/quality.json
            docs/data/stocks.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: docs/
          if-no-files-found: error
          retention-days: 2
  publish:
    if: github.ref == 'refs/heads/main'
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

